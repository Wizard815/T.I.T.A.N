# T.I.T.A.N settings. Copy to /mnt/user/appdata/titan/titan.yaml.
# Check it with: docker exec titan /titan check

# Every model call goes through Argos. The names below are Argos model IDs:
# point them at local or cloud models in Argos (profiles or selectors), not here.
argos:
  url: http://argos:8080/v1
  # api_key_env: ARGOS_API_KEY   # only if your Argos wants a key
  timeout: 90s
models:
  guard: titan-guard        # reads every message first: allow, ask_owner or refuse
  agent: titan-agent        # the helper that answers and offers fixes
  fallback: titan-fallback  # used when either of the others fails
  # Optional: a decisions model screens every message before the guard, in
  # about 0.2 s. Clear cases are decided there; unsure ones go to the guard.
  # respan/span-01-lite is free; baseten/joey-1 costs about $0.000004 a message.
  # ranker: {model: respan/span-01-lite, key_env: OPENROUTER_API_KEY}

# T.I.T.A.N starts or restarts a service that went down by itself (once an
# hour at most per service), then checks it again. heal: false turns that
# off everywhere; heal: false on a service turns it off for that one.
# heal: true

# titan-hands is the only thing that can change anything.
hands:
  url: http://titan-hands:8111
  token_env: TITAN_HANDS_TOKEN

notify:
  ntfy_url: ""              # e.g. http://odysseus-ntfy-1/titan (your Odysseus ntfy) for a ping when something needs you
  # Hermes hears about incidents (needs_owner, self_fix, back_up); see docs/hermes.md
  # hook: {url: http://hermes:8644/webhooks/titan, secret_env: TITAN_HERMES_SECRET}

# Who sees the server panel (CPU, memory, disks, GPUs): owner, family, friends or off.
server_view: owner

faith_url: http://192.168.20.5:8097   # "Ask FAITH" link for family (guess at the Unraid IP)


kuma:
  url: http://uptime-kuma:3001   # or http://192.168.20.5:3002 if Kuma isn't on ai_net
  slug: home                     # a published status page
  import_all: true               # show its other monitors too (read only)
  audience: family

# Or Gatus instead:  kuma: {kind: gatus, url: http://gatus:8080}

# Every container titan-hands sees becomes a card (read only, yours unless labelled).
discover:
  docker: true
  host: 192.168.20.5        # Unraid's IP, for the Open buttons
  audience: owner
  skip: []

style: caveman              # short replies with an Explain button; or plain
room:
  words: []                 # extra words to mask in #room (swears and slurs are built in)

# "Is my show coming?" (read only). Leave out any stage you don't run.
pipeline:
  audience: family
  seerr:    {url: http://overseerr:5055, key_env: SEERR_API_KEY}
  sonarr:   {url: http://binhex-sonarr:8989, key_env: SONARR_API_KEY}
  radarr:   {url: http://binhex-radarr:7878, key_env: RADARR_API_KEY}
  sabnzbd:  {url: http://binhex-sabnzbd:8080, key_env: SABNZBD_API_KEY}
  tautulli: {url: http://tautulli:8181, key_env: TAUTULLI_API_KEY}

check_every: 60s
keep_days: 90
limits:
  per_hour: 3               # the same fix on the same service, per hour (owner exempt)
  confirm_within: 10m       # a Yes after this is too late

# audience: who sees it (friends, family, owner). fix_by: who may ask for its
# fixes (defaults to audience). person: only that account (and the owner).
# actions: check_now, start_service, restart_service, run_sync, recent_problems.
# link: an Open button, shown to the owner only (home addresses don't work
# for anyone else).
# Container names below are from Wizard's Unraid list (2026-11-27); every one
# you allow fixes for must also be in TITAN_HANDS_CONTAINERS.
services:
  # Games. Enshrouded runs inside AMP: titan-hands starts and restarts the
  # one instance through AMP's API, never the AMP container (that would stop
  # every game). Use your instance's name from AMP.
  - id: enshrouded
    name: Enshrouded
    group: Games
    about: Ask here if you can't join.
    audience: friends
    amp: Enshrouded01
    check: {amp: true}
    actions: [start_service, restart_service]
    # shown to anyone who says they can't join; say where the password is
    # rather than writing it here
    join: "Server: Wizard's World. The password is pinned in Discord #games."

  - id: plex
    name: Plex
    group: Media
    audience: friends
    container: binhex-plexpass
    check: {container: true}
    actions: [restart_service]
    fix_by: family
    depends_on: [tunnel]      # from outside, Plex is down whenever the tunnel is
    info:
      - tautulli: {url: http://tautulli:8181, key_env: TAUTULLI_API_KEY}
      - seerr: {url: http://Seerr:5055, key_env: SEERR_API_KEY, label: Requests}
      - arr: {url: http://binhex-sonarr:8989, key_env: SONARR_API_KEY, label: TV downloads}
      - arr: {url: http://binhex-radarr:7878, key_env: RADARR_API_KEY, label: Movie downloads}

  - id: seerr
    name: Requests (Seerr)
    group: Media
    audience: friends
    container: Seerr
    check: {http: http://Seerr:5055/api/v1/status}

  - id: faith
    name: FAITH
    group: Family
    about: The family assistant.
    audience: family
    container: faith
    check: {http: http://faith:8097/health}
    depends_on: [argos]        # FAITH can't think without Argos
    actions: [restart_service, recent_problems]

  - id: wiki
    name: Family wiki
    group: Family
    audience: family
    container: LLMWIKI
    check: {container: true}
    actions: [restart_service]

  - id: immich
    name: Photos (Immich)
    group: Family
    audience: family
    container: immich
    check: {container: true}
    actions: [restart_service]

  - id: mealie
    name: Recipes (Mealie)
    group: Family
    audience: family
    container: mealiev1
    check: {container: true}
    actions: [restart_service]

  # The DnD sync: a guess until Wizard confirms which job it is
  # (LegendKeeper or Kanka). Point freshness at its status and sync at the job.
  # - id: dnd-sync
  #   name: DnD sync
  #   group: Family
  #   audience: family
  #   sync: dnd
  #   check:
  #     freshness: {url: http://legendkeepermcp:9989/status, field: last_sync, max_age: 6h}
  #   actions: [run_sync]

  - id: argos
    name: The AI (Argos)
    group: Homelab
    audience: family
    fix_by: owner
    check: {http: http://argos:8080/health}
    info:
      - argos: {url: http://argos:8080}   # which models are loaded (Argos's /running)

  - id: tunnel
    name: Outside access (Cloudflare tunnel)
    group: Homelab
    audience: owner
    container: Unraid-Cloudflared-Tunnel
    check: {container: true}
